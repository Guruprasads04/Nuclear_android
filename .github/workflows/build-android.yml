name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: 1
  NDK_VERSION: "28.2.13676358"

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        run: |
          SDK_DIR="$HOME/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" > /dev/null
          test -d "$SDK_DIR/ndk/${NDK_VERSION}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_DIR/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Get PNPM store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup PNPM cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/player/src-tauri/target/
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build APK
        working-directory: packages/player
        run: pnpm tauri android build --apk --target aarch64 --target x86_64 --ci

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mapfile -t UNSIGNED < <(find packages/player/src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | sort)
          if [ ${#UNSIGNED[@]} -eq 0 ]; then
            echo "No unsigned APK found"
            find packages/player/src-tauri/gen/android/app/build/outputs -name '*.apk'
            exit 1
          fi

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
            KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set; signing with a throwaway key. Uninstall the previous build before installing this one."
            KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            keytool -genkeypair -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" \
              -alias nuclear -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Nuclear Android Build"
          fi

          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          mkdir -p apks
          for apk in "${UNSIGNED[@]}"; do
            case "$apk" in
              *arm64*) name=nuclear-android-arm64.apk ;;
              *x86_64*) name=nuclear-android-x86_64.apk ;;
              *) name=$(basename "$apk" -unsigned.apk).apk ;;
            esac
            "$BUILD_TOOLS/zipalign" -f -p 4 "$apk" aligned.apk
            "$BUILD_TOOLS/apksigner" sign --ks release.keystore --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --out "apks/$name" aligned.apk
            echo "Signed apks/$name"
            rm -f aligned.apk
          done
          rm -f release.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nuclear-android-arm64
          if-no-files-found: error
          path: apks/nuclear-android-arm64.apk

      - name: Upload emulator APK
        uses: actions/upload-artifact@v7
        with:
          name: nuclear-android-x86_64
          if-no-files-found: error
          path: apks/nuclear-android-x86_64.apk
